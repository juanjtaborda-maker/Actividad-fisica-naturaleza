<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actividad Física en la Naturaleza Rural | REDA</title>
  
  <!-- Tipografía estilo National Geographic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
  
  <!-- Librería de Animaciones al Hacer Scroll (AOS CSS) -->
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

  <style>
    :root {
      --natgeo-yellow: #ffcc00;
      --bg-dark: #0f0f11;
      --bg-card: #18181c;
      --text-main: #f0f0f0;
      --text-muted: #a0a0a0;
      --border-color: #2a2a30;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Open Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* Barra de Progreso de Lectura */
    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 4px;
      background: var(--natgeo-yellow);
      width: 0%;
      z-index: 1000;
      transition: width 0.1s ease-out;
    }

    /* Navegación Fija Translúcida */
    nav {
      background-color: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      padding: 16px 20px;
      border-bottom: 2px solid var(--natgeo-yellow);
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }

    nav a {
      color: var(--text-main);
      text-decoration: none;
      margin: 5px 18px;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 1.5px;
      position: relative;
      transition: color 0.3s;
    }

    nav a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -4px;
      left: 0;
      background-color: var(--natgeo-yellow);
      transition: width 0.3s ease;
    }

    nav a:hover::after {
      width: 100%;
    }

    nav a:hover {
      color: var(--natgeo-yellow);
    }

    /* Portada Principal Hero con Parallax */
    header.hero {
      height: 90vh;
      background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(15,15,17,0.95)), 
                  url('https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEiHBZDw2kfBf_2bcSJ_E7SRJFU6QIKXtjYPeo-oKJCCvOAB0pMNNZRhFIe79uw8XR2eAUsWpTPRpYwmH4w_jauOPWdNSaGBsCC2Kgfv2aZDm7900SJE5As_KJqla6RcX1lev22Fin78ZhIukkXwnsmQl_gzhQEK1loMXrZ-KtxfSdKN8XxooHRGQRroYd6b/s2752/Mapa_de_la_gran_aventura.png') center/cover no-repeat fixed;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
    }

    .badge-reda {
      background-color: var(--natgeo-yellow);
      color: #000;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 6px 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
      border-radius: 2px;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    header.hero h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.2rem, 5vw, 4rem);
      letter-spacing: 2px;
      margin-bottom: 15px;
      max-width: 1000px;
      text-shadow: 0 4px 10px rgba(0,0,0,0.8);
    }

    header.hero p {
      font-size: 1.2rem;
      color: var(--text-muted);
      max-width: 750px;
      font-weight: 300;
    }

    /* Secciones Generales */
    section {
      padding: 80px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-title {
      font-family: 'Cinzel', serif;
      font-size: 2.3rem;
      margin-bottom: 15px;
      color: var(--natgeo-yellow);
      text-align: center;
    }

    .section-subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 50px;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }

    /* Caja de Propósito Pedagógico */
    .purpose-card {
      background-color: var(--bg-card);
      border-left: 4px solid var(--natgeo-yellow);
      padding: 35px;
      border-radius: 6px;
      margin-bottom: 40px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: transform 0.3s;
    }

    .purpose-card:hover {
      transform: translateY(-3px);
    }

    .purpose-card p {
      font-size: 1.15rem;
      line-height: 1.8;
      margin-bottom: 15px;
    }

    /* Reproductor de Audio */
    .audio-player-box {
      margin-top: 25px;
      padding: 20px;
      background: #111115;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      text-align: center;
    }

    .audio-player-box h4 {
      color: var(--natgeo-yellow);
      margin-bottom: 10px;
      font-family: 'Cinzel', serif;
    }

    audio {
      width: 100%;
      max-width: 500px;
      margin-top: 10px;
    }

    /* Cuadrícula de Galería Técnica (Efecto Hover Zoom) */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
    }

    .photo-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .photo-card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: var(--natgeo-yellow);
      box-shadow: 0 15px 30px rgba(255, 204, 0, 0.15);
    }

    .img-wrapper {
      overflow: hidden;
      height: 280px;
    }

    .photo-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .photo-card:hover img {
      transform: scale(1.1);
    }

    .photo-info {
      padding: 20px;
    }

    .photo-info ul {
      list-style: none;
      font-size: 0.9rem;
    }

    .photo-info li {
      margin-bottom: 8px;
      border-bottom: 1px dashed #2a2a2a;
      padding-bottom: 6px;
    }

    .photo-info li strong {
      color: var(--natgeo-yellow);
    }

    .license-tag {
      display: inline-block;
      margin-top: 10px;
      background-color: #222;
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 4px;
      border: 1px solid #333;
    }

    /* Galería de Actividades e Infografías */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 30px;
      margin-top: 30px;
    }

    .media-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 25px;
      text-align: center;
      transition: transform 0.3s ease, border-color 0.3s;
    }

    .media-card:hover {
      transform: translateY(-8px);
      border-color: var(--natgeo-yellow);
    }

    .media-card img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      margin-bottom: 15px;
      transition: transform 0.3s;
    }

    .media-card:hover img {
      transform: scale(1.03);
    }

    .media-card p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .source-link {
      color: var(--natgeo-yellow);
      text-decoration: none;
      font-size: 0.85rem;
      word-break: break-all;
    }

    .source-link:hover {
      text-decoration: underline;
    }

    /* Contenedor de Vídeo HTML5 */
    .video-box {
      background-color: var(--bg-card);
      border: 2px solid var(--natgeo-yellow);
      border-radius: 8px;
      padding: 15px;
